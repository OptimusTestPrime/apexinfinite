<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apex Infinite</title>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const log = document.getElementById('loading-text');
            if (log) {
                log.style.color = '#ff4444';
                log.innerHTML = 'SYSTEM ERROR:<br>' + message + '<br>Line: ' + lineno;
            }
            return false;
        };
    </script>
</head>
<body>
    <div id="landscape-prompt">
        <div style="text-align: center;">
            <div style="font-size: 40px; margin-bottom: 15px;">🔄</div>
            <div>Please Rotate Device</div>
            <div style="font-size: 14px; color: #aaa; margin-top: 5px;">Landscape mode required</div>
        </div>
    </div>

    <div id="loading">
        <div style="text-align: center;">
            <div style="font-size: 42px; margin-bottom: 10px; color: #ffffff; font-family: sans-serif; font-weight: bold;">Apex Infinite</div>
            <div id="loading-text" style="font-size: 16px; color: #aaa; font-family: sans-serif;">Generating World...</div>
        </div>
    </div>
    
    <div id="top-hud">
        <!-- Lap Info (Top Left) -->
        <div class="glass-panel time-container">
            <div class="time-col">
                <span class="time-label">Lap <span id="lapCount">1</span></span>
                <span class="time-val" id="currentLap">00:00.00</span>
            </div>
            <div class="time-col">
                <span class="time-label">Best</span>
                <span class="time-val" id="bestLap">--:--.--</span>
            </div>
        </div>

        <!-- Speed Info (Top Center) -->
        <div class="speed-container">
            <span class="speed-val" id="speedVal">0</span>
            <div class="speed-bar"><div class="speed-fill" id="speedBarFill"></div></div>
            <span class="speed-unit">km/h</span>
        </div>
    </div>

    <!-- Mobile Touch Controls (Bottom Corners) -->
    <div id="mobile-controls">
        <div class="control-group">
            <div class="touch-btn" id="btn-left">❮</div>
            <div class="touch-btn" id="btn-right">❯</div>
        </div>
        <div class="control-group">
            <div class="touch-btn" id="btn-down">▼</div>
            <div class="touch-btn" id="btn-up">▲</div>
        </div>
    </div>

    <div id="new-record">NEW RECORD!</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/92/three.min.js"></script>
    <script src="js/physi.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
